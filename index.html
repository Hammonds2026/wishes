<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Santa Wishes 🎄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #C0392B; --red-deep: #96281B; --red-light: #E74C3C;
      --gold: #D4A843; --gold-light: #F0C060;
      --green: #1A5C38; --green-mid: #27AE60;
      --cream: #FDF8F0; --cream-dark: #F5EDD8;
      --dark: #1C1410; --text: #2C1810; --text-muted: #7A6050;
      --white: #FFFFFF;
      --shadow: 0 4px 24px rgba(28,20,16,0.15);
      --shadow-lg: 0 8px 48px rgba(28,20,16,0.2);
      --radius: 16px; --radius-sm: 8px;
    }
    html, body { height: 100%; font-family: 'Lato', sans-serif; background: var(--dark); }
    .app {
      min-height: 100vh;
      background: linear-gradient(160deg, #0D0A08 0%, #1C1410 40%, #0F1A0F 100%);
      position: relative; overflow-x: hidden;
    }
    .app::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(192,57,43,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(26,92,56,0.08) 0%, transparent 50%),
        radial-gradient(circle at 60% 30%, rgba(212,168,67,0.05) 0%, transparent 40%);
      pointer-events: none; z-index: 0;
    }
    .snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .flake { position: absolute; top: -20px; color: rgba(255,255,255,0.7); animation: fall linear infinite; user-select: none; font-size: 14px; }
    @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    .content { position: relative; z-index: 1; }

    /* Header */
    .header { text-align: center; padding: 48px 24px 32px; }
    .header-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--dark); font-size: 11px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      padding: 6px 18px; border-radius: 100px; margin-bottom: 20px;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 4rem); font-weight: 700;
      color: var(--cream); line-height: 1.1;
      text-shadow: 0 2px 20px rgba(212,168,67,0.3); margin-bottom: 8px;
    }
    .header h1 span { color: var(--gold); }
    .header p { color: var(--text-muted); font-size: 15px; font-weight: 300; }

    /* Auth */
    .auth-wrap { max-width: 440px; margin: 0 auto; padding: 0 20px 60px; }
    .card {
      background: linear-gradient(145deg, rgba(253,248,240,0.97), rgba(245,237,216,0.95));
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(212,168,67,0.2);
    }
    .auth-card { padding: 40px; }
    .auth-tabs { display: flex; border-bottom: 2px solid var(--cream-dark); margin-bottom: 32px; }
    .auth-tab {
      flex: 1; padding: 12px; background: none; border: none;
      font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted);
      cursor: pointer; transition: all 0.2s; border-bottom: 3px solid transparent; margin-bottom: -2px;
    }
    .auth-tab.active { color: var(--red); border-bottom-color: var(--red); }

    /* Forms */
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .form-input {
      width: 100%; padding: 14px 16px; border: 2px solid var(--cream-dark);
      border-radius: var(--radius-sm); font-family: 'Lato', sans-serif; font-size: 15px;
      color: var(--text); background: var(--white); transition: border-color 0.2s, box-shadow 0.2s; outline: none;
    }
    .form-input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(192,57,43,0.1); }
    .form-input::placeholder { color: #C0B0A0; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 24px; border: none; border-radius: var(--radius-sm);
      font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--red), var(--red-deep)); color: var(--white); box-shadow: 0 4px 16px rgba(192,57,43,0.35); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(192,57,43,0.45); }
    .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--dark); box-shadow: 0 4px 16px rgba(212,168,67,0.35); }
    .btn-gold:hover { transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 2px solid var(--cream-dark); }
    .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }
    .btn-green { background: linear-gradient(135deg, var(--green), var(--green-mid)); color: var(--white); }
    .btn-green:hover { transform: translateY(-1px); }
    .btn-sm { padding: 8px 16px; font-size: 12px; }
    .btn-full { width: 100%; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    .alert { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 20px; }
    .alert-error { background: #FEE; color: var(--red-deep); border: 1px solid #FCC; }
    .alert-success { background: #EFE; color: var(--green); border: 1px solid #CEC; }
    .alert-info { background: #FFF8E8; color: #8B6914; border: 1px solid #F0C060; }

    /* Nav */
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px; background: rgba(28,20,16,0.7);
      backdrop-filter: blur(12px); border-bottom: 1px solid rgba(212,168,67,0.15);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-brand { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold); font-weight: 700; }
    .nav-brand span { color: var(--cream); }
    .nav-user { display: flex; align-items: center; gap: 12px; }
    .nav-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 14px; border: 2px solid var(--gold);
    }
    .nav-name { color: var(--cream); font-size: 14px; }
    .nav-signout {
      background: none; border: 1px solid rgba(255,255,255,0.15); color: var(--text-muted);
      padding: 6px 14px; border-radius: 6px; font-size: 12px; font-family: 'Lato', sans-serif;
      cursor: pointer; transition: all 0.2s;
    }
    .nav-signout:hover { border-color: var(--red-light); color: var(--red-light); }

    /* Main */
    .main-wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 80px; }
    .tabs {
      display: flex; gap: 4px; background: rgba(0,0,0,0.3);
      border-radius: 12px; padding: 4px; margin: 32px 0 28px;
    }
    .tab {
      flex: 1; padding: 12px 8px; background: none; border: none; border-radius: 9px;
      font-family: 'Lato', sans-serif; font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.25s; text-align: center;
    }
    .tab.active { background: linear-gradient(135deg, var(--red), var(--red-deep)); color: var(--white); box-shadow: 0 3px 12px rgba(192,57,43,0.4); }
    .tab:hover:not(.active) { color: rgba(255,255,255,0.7); }

    .section-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--cream); margin-bottom: 6px; }
    .section-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

    /* Add form */
    .add-form { background: rgba(253,248,240,0.05); border: 1px solid rgba(212,168,67,0.2); border-radius: var(--radius); padding: 24px; margin-bottom: 24px; }
    .add-form-title { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.1rem; margin-bottom: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-input-dark {
      width: 100%; padding: 12px 14px; border: 1px solid rgba(212,168,67,0.25);
      border-radius: var(--radius-sm); font-family: 'Lato', sans-serif; font-size: 14px;
      color: var(--cream); background: rgba(0,0,0,0.3); outline: none; transition: border-color 0.2s;
    }
    .form-input-dark:focus { border-color: var(--gold); }
    .form-input-dark::placeholder { color: rgba(255,255,255,0.25); }
    .form-label-light { display: block; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 6px; }

    /* Wish items */
    .wish-list { display: flex; flex-direction: column; gap: 12px; }
    .wish-item {
      display: flex; align-items: flex-start; gap: 14px;
      background: rgba(253,248,240,0.04); border: 1px solid rgba(212,168,67,0.12);
      border-radius: 12px; padding: 16px 18px; transition: all 0.2s;
    }
    .wish-item:hover { border-color: rgba(212,168,67,0.25); background: rgba(253,248,240,0.07); }
    .wish-icon { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, rgba(192,57,43,0.3), rgba(150,40,27,0.3)); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .wish-content { flex: 1; min-width: 0; }
    .wish-name { font-family: 'Playfair Display', serif; color: var(--cream); font-size: 1rem; margin-bottom: 4px; }
    .wish-note { color: var(--text-muted); font-size: 13px; margin-bottom: 6px; }
    .wish-link { color: var(--gold); font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; opacity: 0.8; }
    .wish-link:hover { opacity: 1; }
    .delete-btn { background: none; border: none; color: rgba(255,255,255,0.2); cursor: pointer; font-size: 16px; padding: 4px; transition: color 0.2s; }
    .delete-btn:hover { color: var(--red-light); }

    /* Family */
    .family-grid { display: flex; flex-direction: column; gap: 28px; }
    .family-member { background: rgba(253,248,240,0.04); border: 1px solid rgba(212,168,67,0.12); border-radius: var(--radius); overflow: hidden; }
    .family-member-header { display: flex; align-items: center; gap: 14px; padding: 20px 24px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(212,168,67,0.1); }
    .member-avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: white; flex-shrink: 0; }
    .member-info { flex: 1; }
    .member-name { font-family: 'Playfair Display', serif; color: var(--cream); font-size: 1.1rem; }
    .member-count { color: var(--text-muted); font-size: 13px; }
    .member-items { padding: 16px 24px; display: flex; flex-direction: column; gap: 10px; }
    .member-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: rgba(0,0,0,0.15); transition: all 0.2s; }
    .member-item:hover { background: rgba(0,0,0,0.25); }
    .member-item-claimed { background: rgba(26,92,56,0.12); }
    .member-item-content { flex: 1; min-width: 0; }
    .member-item-name { color: var(--cream); font-size: 14px; margin-bottom: 3px; }
    .member-item-note { color: var(--text-muted); font-size: 12px; }
    .claim-btn { background: linear-gradient(135deg, var(--green), var(--green-mid)); color: white; border: none; border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; flex-shrink: 0; font-family: 'Lato', sans-serif; }
    .claim-btn:hover { transform: translateY(-1px); }
    .unclaim-btn { background: transparent; color: var(--green-mid); border: 1px solid rgba(39,174,96,0.3); border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; flex-shrink: 0; font-family: 'Lato', sans-serif; }
    .claimed-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(39,174,96,0.2); color: var(--green-mid); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 5px 10px; border-radius: 100px; }
    .link-item { color: var(--gold-light); font-size: 12px; text-decoration: none; }
    .link-item:hover { text-decoration: underline; }

    /* AI */
    .ai-wrap { max-width: 640px; margin: 0 auto; }
    .ai-card { background: linear-gradient(145deg, rgba(28,20,16,0.9), rgba(15,26,15,0.9)); border: 1px solid rgba(212,168,67,0.2); border-radius: var(--radius); padding: 36px; }
    .ai-header { text-align: center; margin-bottom: 32px; }
    .ai-icon { font-size: 48px; margin-bottom: 12px; }
    .ai-title { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.6rem; margin-bottom: 8px; }
    .ai-sub { color: var(--text-muted); font-size: 14px; }
    .ai-progress { display: flex; gap: 6px; margin-bottom: 28px; }
    .ai-progress-dot { height: 4px; flex: 1; border-radius: 2px; background: rgba(255,255,255,0.1); transition: background 0.3s; }
    .ai-progress-dot.done { background: var(--gold); }
    .ai-step-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
    .ai-options { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .ai-option-btn {
      padding: 10px 18px; background: rgba(0,0,0,0.2); border: 1px solid rgba(212,168,67,0.25);
      border-radius: 8px; color: var(--cream); font-size: 14px; font-family: 'Lato', sans-serif;
      cursor: pointer; transition: all 0.2s;
    }
    .ai-option-btn:hover { border-color: var(--gold); background: rgba(212,168,67,0.1); }
    .suggestions-grid { display: flex; flex-direction: column; gap: 12px; }
    .suggestion-item { display: flex; align-items: center; gap: 14px; padding: 16px; background: rgba(253,248,240,0.05); border: 1px solid rgba(212,168,67,0.15); border-radius: 12px; transition: all 0.2s; }
    .suggestion-item:hover { border-color: rgba(212,168,67,0.35); }
    .suggestion-content { flex: 1; }
    .suggestion-name { color: var(--cream); font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .suggestion-desc { color: var(--text-muted); font-size: 13px; }
    .add-sugg-btn { background: linear-gradient(135deg, var(--red), var(--red-deep)); color: white; border: none; border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; flex-shrink: 0; font-family: 'Lato', sans-serif; }
    .add-sugg-btn:hover { transform: translateY(-1px); }
    .add-sugg-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .added-badge { color: var(--green-mid); font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(212,168,67,0.2), transparent); margin: 28px 0; }

    /* Admin */
    .admin-card { background: rgba(253,248,240,0.04); border: 1px solid rgba(212,168,67,0.12); border-radius: var(--radius); padding: 28px; margin-bottom: 24px; }
    .admin-title { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.2rem; margin-bottom: 16px; }
    .invite-code-box { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(212,168,67,0.2); border-radius: 8px; padding: 12px 16px; flex-wrap: wrap; }
    .invite-code { font-family: monospace; font-size: 18px; color: var(--gold); letter-spacing: 4px; flex: 1; }
    .copy-btn { background: rgba(212,168,67,0.15); border: 1px solid rgba(212,168,67,0.3); color: var(--gold); padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Lato', sans-serif; transition: all 0.2s; letter-spacing: 0.5px; }
    .copy-btn:hover { background: rgba(212,168,67,0.25); }
    .member-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 8px; }
    .member-row-info { flex: 1; }
    .member-row-name { color: var(--cream); font-size: 14px; font-weight: 700; }
    .member-row-email { color: var(--text-muted); font-size: 12px; }
    .role-badge { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 100px; }
    .role-admin { background: rgba(212,168,67,0.2); color: var(--gold); }
    .role-member { background: rgba(255,255,255,0.08); color: var(--text-muted); }

    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; padding: 48px; gap: 12px; }
    .spinner { width: 24px; height: 24px; border: 3px solid rgba(212,168,67,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
    .no-items { color: var(--text-muted); font-size: 14px; font-style: italic; padding: 8px 0; }

    .wishlist-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }

    @media (max-width: 600px) {
      .nav { padding: 14px 16px; }
      .nav-name { display: none; }
      .ai-card { padding: 24px; }
      .auth-card { padding: 28px 24px; }
      .form-row { grid-template-columns: 1fr; }
      .tab { font-size: 11px; padding: 10px 4px; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="snow" id="snow"></div>
  <div class="content" id="content">
    <div class="loading"><div class="spinner"></div><span style="color:#D4A843">Loading...</span></div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://qgjikyladqibpgdrdnkz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnamlreWxhZHFpYnBnZHJkbmt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwODc0MDIsImV4cCI6MjA5MTY2MzQwMn0.vBSf8ExNMEQRlqmQKxEJ7XW0h2XwBxcJZR3d2cBJ-08';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const GIFT_ICONS = ['🎁','🧣','📚','🎮','🎨','🧸','💄','🍷','🎵','👟','🌿','✨','🕯️','🧴','🎧'];
const AVATAR_COLORS = ['#C0392B','#8E44AD','#2980B9','#16A085','#D35400','#6C3483','#1A5C38','#8B4513'];
const avatarColor = name => AVATAR_COLORS[(name?.charCodeAt(0)||0) % AVATAR_COLORS.length];
const randomIcon = () => GIFT_ICONS[Math.floor(Math.random()*GIFT_ICONS.length)];

let currentUser = null;
let currentProfile = null;
let currentView = 'mylist';

// ── Snow ──────────────────────────────────────────────────────────────────────
(function() {
  const snow = document.getElementById('snow');
  for (let i = 0; i < 30; i++) {
    const f = document.createElement('div');
    f.className = 'flake';
    f.textContent = '❄';
    f.style.cssText = `left:${Math.random()*100}%;font-size:${4+Math.random()*10}px;opacity:${0.3+Math.random()*0.5};animation-duration:${6+Math.random()*8}s;animation-delay:${Math.random()*8}s`;
    snow.appendChild(f);
  }
})();

// ── Render helpers ────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const content = () => document.getElementById('content');

function render(html) { content().innerHTML = html; }

function renderApp(inner, view) {
  const isAdmin = currentProfile?.is_admin;

function setViewContent(html) {
  const el = document.getElementById('view-content');
  if (el) el.innerHTML = html;
}

async function switchView(v) {
  currentView = v;
  renderApp('<div class="loading"><div class="spinner"></div></div>', v);
  if (v === 'mylist') await renderMyList();
  else if (v === 'family') await renderFamily();
  else if (v === 'ai') renderAI();
  else if (v === 'admin') await renderAdmin();
}

// ── Auth ──────────────────────────────────────────────────────────────────────
async function init() {
  render('<div class="loading"><div class="spinner"></div><span style="color:#D4A843">Loading...</span></div>');
  
  // Timeout safety net - if nothing happens in 5s, show login
  const timeout = setTimeout(() => {
    if (!currentUser) renderAuth('login');
  }, 5000);

  try {
    // Check existing session first
    const { data: { session }, error } = await sb.auth.getSession();
    clearTimeout(timeout);
    
    if (error) {
      console.error('Session error:', error);
      renderAuth('login');
      return;
    }

    if (session?.user) {
      currentUser = session.user;
      let { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
      if (!profile) {
        const { count } = await sb.from('profiles').select('*', { count: 'exact', head: true });
        await sb.from('profiles').insert({ id: session.user.id, name: session.user.user_metadata?.name || 'Member', is_admin: count === 0 });
        const { data: newProfile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
        profile = newProfile;
      }
      currentProfile = profile;
      await switchView('mylist');
    } else {
      renderAuth('login');
    }

    // Listen for future auth changes (login/logout)
    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session?.user) {
        currentUser = session.user;
        let { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
        if (!profile) {
          const { count } = await sb.from('profiles').select('*', { count: 'exact', head: true });
          await sb.from('profiles').insert({ id: session.user.id, name: session.user.user_metadata?.name || 'Member', is_admin: count === 0 });
          const { data: newProfile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
          profile = newProfile;
        }
        currentProfile = profile;
        await switchView('mylist');
      } else if (event === 'SIGNED_OUT') {
        currentUser = null; currentProfile = null;
        renderAuth('login');
      }
    });

  } catch(err) {
    clearTimeout(timeout);
    console.error('Init error:', err);
    renderAuth('login');
  }
}

function renderAuth(tab) {

function authError(msg) {
  const el = $('auth-error');
  if (el) el.innerHTML = `<div class="alert alert-error">${msg}</div>`;
}

async function doLogin() {
  const email = $('f-email')?.value?.trim();
  const pass = $('f-pass')?.value;
  if (!email || !pass) return authError('Please fill in all fields.');
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) return authError('Incorrect email or password.');
  const { data: { user } } = await sb.auth.getUser();
  currentUser = user;
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
  currentProfile = data;
  await switchView('mylist');
}

async function doRegister() {
  const name = $('f-name')?.value?.trim();
  const email = $('f-email')?.value?.trim();
  const pass = $('f-pass')?.value;
  const invite = $('f-invite')?.value?.trim().toUpperCase();
  if (!name || !email || !pass) return authError('Please fill in all fields.');
  if (pass.length < 8) return authError('Password must be at least 8 characters.');
  if (passwordStrength(pass) < 2) return authError('Please choose a stronger password.');

  // Check if first user
  const { count } = await sb.from('profiles').select('*', { count: 'exact', head: true });
  const isFirst = count === 0;

  if (!isFirst) {
    if (!invite) return authError('An invite code is required to join.');
    const { data: inv } = await sb.from('invites').select('*').eq('code', invite).eq('used', false).single();
    if (!inv) return authError('Invalid or already used invite code.');
  }

  // Store name in metadata so we can use it if email confirmation is required
  const { data: authData, error } = await sb.auth.signUp({
    email, password: pass,
    options: { data: { name } }
  });
  if (error) return authError(error.message);

  const userId = authData.user?.id;
  if (!userId) return authError('Sign up failed. Please try again.');

  // Insert profile immediately (works when email confirmation is disabled)
  const { error: profileError } = await sb.from('profiles').insert({ id: userId, name, is_admin: isFirst });

  if (!isFirst && invite) {
    const { data: inv } = await sb.from('invites').select('*').eq('code', invite).single();
    if (inv) await sb.from('invites').update({ used: true, used_by: userId }).eq('id', inv.id);
  }

  // If profile insert failed, show confirmation message
  if (profileError && profileError.code !== '23505') {
    render('<div style="text-align:center;padding:60px 20px"><div style="color:#D4A843;font-family:Playfair Display,serif;font-size:1.5rem;margin-bottom:16px">Check your email!</div><div style="color:#7A6050;font-size:14px;margin-bottom:24px">We sent a confirmation link. Click it then come back to sign in.</div><button class="btn btn-primary" onclick="renderAuth('login')">Go to Sign In</button></div>');
    return;
  }

  // onAuthStateChange will handle the rest
}

async function signOut() {
  await sb.auth.signOut();
  currentUser = null; currentProfile = null;
  renderAuth('login');
}

let showAddForm = false;

async function renderMyList() {
  const { data: items } = await sb.from('wishes').select('*').eq('user_id', currentUser.id).order('created_at');
  const itemsHtml = items?.length ? items.map(item => `
    <div class="wish-item">
      <div class="wish-icon">${item.icon||'🎁'}</div>
      <div class="wish-content">
        <div class="wish-name">${esc(item.name)}</div>
        ${item.note ? `<div class="wish-note">${esc(item.note)}</div>` : ''}
        ${item.url ? `<a href="${esc(item.url)}" target="_blank" class="wish-link">🔗 View link</a>` : ''}
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
        <button class="delete-btn" onclick="deleteWish('${item.id}')" title="Remove">✕</button>
      </div>
    </div>`).join('') : `<div class="empty-state"><div style="font-size:48px;margin-bottom:12px">🎁</div><p>Your wishlist is empty. Add something!</p></div>`;

  setViewContent(`

      <div>
        <div class="section-title">My Wishlist 🎄</div>
        <div class="section-sub">Add what you'd love for Christmas. You won't see if something's been claimed.</div>

      <button class="btn btn-primary btn-sm" onclick="toggleAddForm()">${showAddForm?'Cancel':'+ Add Wish'}</button>
    </div>
    ${showAddForm ? `
    <div class="add-form">
      <div class="add-form-title">✦ Add a wish</div>
      <div class="form-group"><label class="form-label-light">What do you want?</label>
        <input class="form-input-dark" id="w-name" placeholder="e.g. Cashmere jumper in navy" /></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label-light">Notes (optional)</label>
          <input class="form-input-dark" id="w-note" placeholder="e.g. Size M, not XL" /></div>
        <div class="form-group"><label class="form-label-light">Link (optional)</label>
          <input class="form-input-dark" id="w-url" placeholder="https://..." /></div>
      </div>
      <button class="btn btn-gold" onclick="addWish()">Add to my list</button>
    </div>` : ''}
    <div class="wish-list">${itemsHtml}</div>`);
}

function toggleAddForm() { showAddForm = !showAddForm; renderMyList(); }

async function addWish() {
  const name = $('w-name')?.value?.trim();
  if (!name) return;
  const note = $('w-note')?.value?.trim();
  const url = $('w-url')?.value?.trim();
  await sb.from('wishes').insert({ user_id: currentUser.id, name, note: note||null, url: url||null, icon: randomIcon() });
  showAddForm = false;
  await renderMyList();
}

async function deleteWish(id) {
  await sb.from('wishes').delete().eq('id', id).eq('user_id', currentUser.id);
  await renderMyList();
}

// ── Family ────────────────────────────────────────────────────────────────────
async function renderFamily() {
  const { data: members } = await sb.from('profiles').select('*').neq('id', currentUser.id);
  if (!members?.length) {
    setViewContent(`<div class="section-title">Family Wishlists 🎄</div><div class="empty-state" style="margin-top:32px"><div style="font-size:48px;margin-bottom:12px">👨‍👩‍👧‍👦</div><p>No other family members yet. An admin needs to send invite codes.</p></div>`);
    return;
  }
  const memberIds = members.map(m => m.id);
  const { data: allWishes } = await sb.from('wishes').select('*').in('user_id', memberIds).order('created_at');

  const membersHtml = members.map(member => {
    const wishes = allWishes?.filter(w => w.user_id === member.id) || [];
    const claimed = wishes.filter(w => w.claimed_by).length;
    const wishesHtml = wishes.length ? wishes.map(w => {
      const isMine = w.claimed_by === currentUser.id;
      const isClaimed = !!w.claimed_by;
      return `<div class="member-item ${isClaimed?'member-item-claimed':''}">
        <span style="font-size:20px">${w.icon||'🎁'}</span>
        <div class="member-item-content">
          <div class="member-item-name" style="${isClaimed&&!isMine?'text-decoration:line-through;opacity:0.5':''}">${esc(w.name)}</div>
          ${w.note?`<div class="member-item-note">${esc(w.note)}</div>`:''}
          ${w.url?`<a href="${esc(w.url)}" target="_blank" class="link-item">🔗 View</a>`:''}
        </div>
        ${isMine ? `<button class="unclaim-btn" onclick="claimWish('${w.id}','${member.id}',true)">✓ Unclaim</button>`
          : isClaimed ? `<span class="claimed-badge">✓ Taken</span>`
          : `<button class="claim-btn" onclick="claimWish('${w.id}','${member.id}',false)">I'll buy this</button>`}
      </div>`;
    }).join('') : `<div class="no-items">No wishes added yet.</div>`;

    return `<div class="family-member">
      <div class="family-member-header">
        <div class="member-avatar" style="background:linear-gradient(135deg,${avatarColor(member.name)},${avatarColor(member.name)}99)">${member.name[0].toUpperCase()}</div>
        <div class="member-info">
          <div class="member-name">${esc(member.name)}</div>
          <div class="member-count">${wishes.length} ${wishes.length===1?'wish':'wishes'} · ${claimed} claimed</div>
        </div>
      </div>
      <div class="member-items">${wishesHtml}</div>
    </div>`;
  }).join('');

  setViewContent(`
    <div class="section-title">Family Wishlists 🎄</div>
    <div class="section-sub">Claim what you're buying. The gift-receiver won't know.</div>
    <div class="family-grid">${membersHtml}</div>`);
}

async function claimWish(wishId, memberId, unclaim) {
  await sb.from('wishes').update({ claimed_by: unclaim ? null : currentUser.id }).eq('id', wishId);
  await renderFamily();
}

// ── AI Gift Ideas ─────────────────────────────────────────────────────────────
const AI_STEPS = [
  { key:'age', label:'What\'s your age group?', type:'select', options:['Under 16','16-25','26-35','36-50','51-65','65+'] },
  { key:'interests', label:'What are your main hobbies or interests?', type:'text', placeholder:'e.g. cooking, hiking, reading, gaming...' },
  { key:'budget', label:'What\'s your ideal budget per gift?', type:'select', options:['Under £25','£25-£50','£50-£100','£100-£200','£200+'] },
  { key:'personality', label:'How would you describe yourself?', type:'select', options:['Homebody','Adventurer','Creative','Foodie','Tech lover','Fitness enthusiast','Book lover','Fashionista'] },
  { key:'owns', label:'Anything you already have plenty of or don\'t want?', type:'text', placeholder:'e.g. clothes, tech gadgets, wine...' },
];

let aiStep = 0, aiAnswers = {}, aiSuggestions = null, aiAdded = {};

function renderAI() {
  if (aiSuggestions) { renderAISuggestions(); return; }
  const step = AI_STEPS[aiStep];
  const optionsHtml = step.type === 'select'
    ? `<div class="ai-options">${step.options.map(o=>`<button class="ai-option-btn" onclick="aiNext('${o}')">${o}</button>`).join('')}</div>`
    : `<div style="margin-top:8px"><input class="form-input-dark" id="ai-text" placeholder="${step.placeholder}" style="margin-bottom:12px" onkeydown="if(event.key==='Enter')aiNextText()" /><button class="btn btn-gold" onclick="aiNextText()">Continue →</button></div>`;
  const dots = AI_STEPS.map((_,i)=>`<div class="ai-progress-dot ${i<=aiStep?'done':''}"></div>`).join('');

  setViewContent(`
    <div class="ai-wrap">
      <div class="ai-card">
        <div class="ai-header"><div class="ai-icon">✨</div><div class="ai-title">Gift Idea Finder</div><div class="ai-sub">Answer a few questions and we'll find gifts you'll love</div></div>
        <div class="ai-progress">${dots}</div>
        <div class="ai-step-label">Question ${aiStep+1} of ${AI_STEPS.length}: ${step.label}</div>
        ${optionsHtml}
        ${aiStep>0?`<button class="btn btn-ghost btn-sm" style="margin-top:16px" onclick="aiBack()">← Back</button>`:''}
      </div>
    </div>`);
}

function aiNextText() { const v = $('ai-text')?.value?.trim(); if(v) aiNext(v); }
function aiBack() { aiStep = Math.max(0, aiStep-1); renderAI(); }
async function aiNext(val) {
  const step = AI_STEPS[aiStep];
  aiAnswers[step.key] = val;
  if (aiStep < AI_STEPS.length-1) { aiStep++; renderAI(); }
  else { await aiGenerate(); }
}

async function aiGenerate() {
  setViewContent(`<div class="ai-wrap"><div class="ai-card" style="text-align:center;padding:60px"><div style="font-size:48px;margin-bottom:16px">🎅</div><div style="color:var(--gold);font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:8px">Santa's thinking...</div><div style="color:var(--text-muted);font-size:14px;margin-bottom:24px">Finding the perfect gifts for you</div><div class="spinner" style="margin:0 auto"></div></div></div>`);
  try {
    const prompt = `You are a thoughtful Christmas gift advisor. Based on these answers, suggest 6 specific creative Christmas gift ideas. Age: ${aiAnswers.age}, Interests: ${aiAnswers.interests}, Budget: ${aiAnswers.budget}, Personality: ${aiAnswers.personality}, Already has: ${aiAnswers.owns}. Respond ONLY with a JSON array, no markdown, no backticks. Format: [{"name":"Gift Name","description":"One sentence why they'd love it","url":"https://amazon.co.uk/s?k=keywords"}]`;
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000, messages:[{role:'user',content:prompt}] })
    });
    const data = await res.json();
    const text = data.content?.find(b=>b.type==='text')?.text||'[]';
    aiSuggestions = JSON.parse(text.replace(/```json|```/g,'').trim());
    renderAISuggestions();
  } catch { setViewContent(`<div class="ai-wrap"><div class="ai-card"><div class="alert alert-error">Couldn't get suggestions. Please try again.</div><button class="btn btn-ghost" onclick="aiReset()">Start again</button></div></div>`); }
}

function renderAISuggestions() {
  const html = aiSuggestions.map((s,i) => `
    <div class="suggestion-item">
      <span style="font-size:24px">${GIFT_ICONS[i%GIFT_ICONS.length]}</span>
      <div class="suggestion-content">
        <div class="suggestion-name">${esc(s.name)}</div>
        <div class="suggestion-desc">${esc(s.description)}</div>
      </div>
      ${aiAdded[s.name] ? `<span class="added-badge">✓ Added</span>` : `<button class="add-sugg-btn" onclick="addSuggestion(${i})">+ Add</button>`}
    </div>`).join('');
  setViewContent(`<div class="ai-wrap"><div class="ai-card">
    <div class="ai-header"><div class="ai-icon">🎁</div><div class="ai-title">Your Gift Ideas</div><div class="ai-sub">Add anything you like directly to your wishlist</div></div>
    <div class="suggestions-grid">${html}</div>
    <div class="divider"></div>
    <button class="btn btn-ghost btn-full" onclick="aiReset()">Start again</button>
  </div></div>`);
}

async function addSuggestion(i) {
  const s = aiSuggestions[i];
  await sb.from('wishes').insert({ user_id: currentUser.id, name: s.name, note: s.description, url: s.url, icon: randomIcon() });
  aiAdded[s.name] = true;
  renderAISuggestions();
}

function aiReset() { aiStep=0; aiAnswers={}; aiSuggestions=null; aiAdded={}; renderAI(); }

// ── Admin ─────────────────────────────────────────────────────────────────────
let latestCode = null, codeCopied = false;

async function renderAdmin() {
  const { data: users } = await sb.from('profiles').select('*').order('created_at');
  const { data: invites } = await sb.from('invites').select('*').eq('used', false).order('created_at', {ascending:false});

  const membersHtml = users?.map(u => `
    <div class="member-row">
      <div class="nav-avatar" style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,${avatarColor(u.name)},${avatarColor(u.name)}99);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;flex-shrink:0">${u.name[0].toUpperCase()}</div>
      <div class="member-row-info">
        <div class="member-row-name">${esc(u.name)}${u.id===currentUser.id?' (you)':''}</div>
        <div class="member-row-email">${u.id}</div>
      </div>
      <span class="role-badge ${u.is_admin?'role-admin':'role-member'}">${u.is_admin?'Admin':'Member'}</span>
      ${u.id!==currentUser.id?`
        <button class="btn btn-ghost btn-sm" style="font-size:11px;padding:5px 10px" onclick="toggleAdmin('${u.id}',${u.is_admin})">${u.is_admin?'Remove admin':'Make admin'}</button>
        <button class="btn btn-sm" style="background:rgba(192,57,43,0.15);color:var(--red-light);border:1px solid rgba(192,57,43,0.3);font-size:11px;padding:5px 10px" onclick="removeUser('${u.id}')">Remove</button>`:''}
    </div>`).join('');

  const unusedHtml = invites?.length ? invites.map(i=>`<div style="color:var(--gold);font-family:monospace;font-size:14px;letter-spacing:2px;margin-bottom:4px">${i.code}</div>`).join('') : '';

  setViewContent(`
    <div class="section-title">Admin ⚙️</div>
    <div class="section-sub">Manage family members and invite codes.</div>
    <div class="admin-card">
      <div class="admin-title">🎟 Invite Codes</div>
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Generate a code and share it. Each code can only be used once.</p>
      <button class="btn btn-gold btn-sm" onclick="generateInvite()" style="margin-bottom:16px">Generate new invite code</button>
      <div id="invite-result"></div>
      ${unusedHtml ? `<div style="margin-top:16px"><div style="color:var(--text-muted);font-size:12px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Active unused codes</div>${unusedHtml}</div>` : ''}
    </div>
    <div class="admin-card">
      <div class="admin-title">👨‍👩‍👧‍👦 Family Members</div>
      ${membersHtml}
    </div>`);
}

async function generateInvite() {
  const code = Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
  const { data: profile } = await sb.from('profiles').select('id').eq('id', currentUser.id).single();
  await sb.from('invites').insert({ code, created_by: profile.id });
  latestCode = code;
  const el = $('invite-result');
  if (el) el.innerHTML = `
    <div class="alert alert-success" style="margin-bottom:12px">New code generated. Share it with your family member.</div>
    <div class="invite-code-box">
      <div class="invite-code">${code}</div>
      <button class="copy-btn" id="copy-btn" onclick="copyCode('${code}')">Copy</button>
    </div>`;
}

function copyCode(code) {
  navigator.clipboard.writeText(code);
  const btn = $('copy-btn');
  if (btn) { btn.textContent = 'Copied!'; setTimeout(()=>{ if(btn) btn.textContent='Copy'; }, 2000); }
}

async function toggleAdmin(userId, isAdmin) {
  await sb.from('profiles').update({ is_admin: !isAdmin }).eq('id', userId);
  await renderAdmin();
}

async function removeUser(userId) {
  if (!confirm('Remove this family member?')) return;
  await sb.from('wishes').delete().eq('user_id', userId);
  await sb.from('profiles').delete().eq('id', userId);
  await renderAdmin();
}

// ── Password Strength ─────────────────────────────────────────────────────────
function passwordStrength(pass) {
  let score = 0;
  if (pass.length >= 8) score++;
  if (pass.length >= 12) score++;
  if (/[A-Z]/.test(pass)) score++;
  if (/[0-9]/.test(pass)) score++;
  if (/[^A-Za-z0-9]/.test(pass)) score++;
  return score; // 0-5
}

function updatePasswordStrength() {
  const pass = $('f-pass')?.value || '';
  const meter = $('pw-meter');
  const label = $('pw-label');
  if (!meter || !label) return;
  const score = passwordStrength(pass);
  const levels = [
    { label: '', color: 'rgba(255,255,255,0.1)', w: '0%' },
    { label: 'Very weak', color: '#E74C3C', w: '20%' },
    { label: 'Weak', color: '#E67E22', w: '40%' },
    { label: 'Fair', color: '#F1C40F', w: '60%' },
    { label: 'Strong', color: '#27AE60', w: '80%' },
    { label: 'Very strong', color: '#1A5C38', w: '100%' },
  ];
  const lvl = pass.length === 0 ? levels[0] : levels[Math.min(score, 5)];
  meter.style.width = lvl.w;
  meter.style.background = lvl.color;
  label.textContent = lvl.label;
  label.style.color = lvl.color;
}

// ── Utility ───────────────────────────────────────────────────────────────────
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ──────────────────────────────────────────────────────────────────────
// Show login immediately - don't wait for Supabase
renderAuth('login');
// Then check if there's an existing session in background
(async () => {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) {
      currentUser = session.user;
      const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
      currentProfile = profile;
      if (currentProfile) await switchView('mylist');
    }
  } catch(e) { /* stay on login */ }
})();

// Listen for auth changes (login/logout events)
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_IN' && session?.user) {
    currentUser = session.user;
    let { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if (!profile) {
      const { count } = await sb.from('profiles').select('*', { count: 'exact', head: true });
      await sb.from('profiles').insert({ id: session.user.id, name: session.user.user_metadata?.name || 'Member', is_admin: count === 0 });
      const res = await sb.from('profiles').select('*').eq('id', session.user.id).single();
      profile = res.data;
    }
    currentProfile = profile;
    await switchView('mylist');
  } else if (event === 'SIGNED_OUT') {
    currentUser = null; currentProfile = null;
    renderAuth('login');
  }
});
</script>
